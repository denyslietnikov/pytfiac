name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master
  release:
    types:
      - published
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruff and protocol tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt

      - name: Run Ruff
        run: |
          ruff check custom_components scripts tests
          ruff format --check custom_components scripts tests

      - name: Run tests
        run: pytest --ignore=tests/ha

  home-assistant:
    name: Home Assistant (2026.9.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test*.txt
      - run: python -m pip install --requirement requirements_test_ha.txt
      - name: Test against real HA APIs without network access
        run: pytest --disable-socket --allow-unix-socket --cov=custom_components.tfiac --cov-report=term-missing

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        env:
          # HACS does not read release.tag_name; without this it falls back to master.
          # Use the PR head in its fork, otherwise the exact triggering commit.
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
