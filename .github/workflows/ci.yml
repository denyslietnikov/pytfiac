name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruff and protocol tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements_test.txt

      - name: Run Ruff
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests

      - name: Run tests
        run: pytest tests/test_api.py tests/test_models.py tests/test_metadata.py

  home-assistant:
    name: Home Assistant (2026.9.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test*.txt
      - run: python -m pip install --requirement requirements_test_ha.txt
      - name: Test against real HA APIs without network access
        run: pytest --disable-socket --allow-unix-socket --cov=custom_components.tfiac --cov-report=term-missing
